name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app tests
      - run: pytest --cov=app --cov-report=term-missing
      - run: python scripts/check_no_secrets.py
      - run: python scripts/run_evaluation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: triage-evaluation
          path: reports/evaluation.json
          if-no-files-found: error

  playwright:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playwright-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: playwright-demo/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ai-test-failure-triage-agent:ci

